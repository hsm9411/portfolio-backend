# Server 1 (Prod) 전용 — 시스템/컨테이너 메트릭 수집기
# Server 2 Prometheus가 10.0.0.34:9100, 10.0.0.34:8080 으로 scrape
# OCI Security List + UFW: 10.0.0.196 → 9100, 8080 허용 필요

services:
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: portfolio-node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: portfolio-cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
