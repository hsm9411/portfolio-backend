# Server 1 (Prod) 전용 — 시스템/컨테이너 메트릭 수집기
# Server 2 Prometheus가 10.0.0.34:9100, 10.0.0.34:8080 으로 scrape
# OCI Security List + UFW: 10.0.0.196 → 9100, 8080 허용 필요

services:
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: portfolio-node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  cadvisor:
    # BACK-68: v0.49.1 docker client API 1.41이 docker engine 29.x(min 1.44)에 거부당해
    # docker factory 등록 실패 → 컨테이너 메타데이터 미부착. v0.56.2로 업그레이드(docker/docker 26.x).
    # v0.56부터 레지스트리가 gcr.io → ghcr.io 로 이전됨(PR#3806). 태그도 v 접두 제거('0.56.2').
    image: ghcr.io/google/cadvisor:0.56.2
    container_name: portfolio-cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    command:
      - --docker=unix:///var/run/docker.sock
