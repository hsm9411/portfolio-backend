# Server 2 (Dev) 전용 — 모니터링 허브
# Grafana: https://hsm9411-dev.duckdns.org/grafana (nginx 경유)
# Prometheus: 내부 전용 (외부 노출 없음)

services:
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: portfolio-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - monitoring
      - app

  grafana:
    image: grafana/grafana:11.3.0
    container_name: portfolio-grafana
    restart: unless-stopped
    environment:
      - GF_SERVER_ROOT_URL=https://hsm9411-dev.duckdns.org/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - monitoring
      - app

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: portfolio-node-exporter-dev
    restart: unless-stopped
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  cadvisor:
    # Server 2(2GB RAM)에서 cadvisor 기본 설정이 OOM/CPU 과부하로 간헐 crash → 대시보드 No data.
    # housekeeping interval 늘리고 불필요 메트릭 disable + mem_limit으로 안정화.
    # healthcheck는 일부러 제외 — distroless 이미지에 wget이 없어 BACK-54에서 startup 실패.
    # BACK-68: v0.49.1 → v0.56.2 업그레이드. v0.49.1 docker client API 1.41이
    # docker engine 29.x(min 1.44)에 거부당해 docker factory 등록 실패 → 컨테이너 라벨/이름/이미지
    # 메타데이터가 메트릭에 부착되지 않던 문제 해소(v0.50+에서 docker/docker 26.x로 업그레이드됨).
    image: gcr.io/cadvisor/cadvisor:v0.56.2
    container_name: portfolio-cadvisor-dev
    restart: always
    privileged: true
    expose:
      - "8080"
    mem_limit: 384m
    memswap_limit: 768m
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    command:
      - --docker=unix:///var/run/docker.sock
      - --housekeeping_interval=30s
      - --max_housekeeping_interval=60s
      - --disable_metrics=disk,diskIO,tcp,udp,percpu,sched,process,hugetlb,referenced_memory,cpu_topology,resctrl
    networks:
      - monitoring

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: portfolio-nginx-exporter-dev
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://portfolio-nginx:8080/stub_status
    expose:
      - "9113"
    networks:
      - monitoring
      - app

  redis-exporter:
    image: oliver006/redis_exporter:v1.65.0
    container_name: portfolio-redis-exporter-dev
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://portfolio-redis-dev:6379
    expose:
      - "9121"
    networks:
      - monitoring
      - dev-internal

networks:
  monitoring:
    driver: bridge
    name: portfolio-monitoring-network
  app:
    external: true
    name: global-portfolio-network
  dev-internal:
    external: true
    name: portfolio-dev-internal

volumes:
  prometheus-data:
  grafana-data:
