# Server 2 (Dev) 전용 — 모니터링 허브
# Grafana: https://hsm9411-dev.duckdns.org/grafana (nginx 경유)
# Prometheus: 내부 전용 (외부 노출 없음)

services:
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: portfolio-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - monitoring
      - app

  grafana:
    image: grafana/grafana:11.3.0
    container_name: portfolio-grafana
    restart: unless-stopped
    environment:
      - GF_SERVER_ROOT_URL=https://hsm9411-dev.duckdns.org/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - monitoring
      - app

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: portfolio-node-exporter-dev
    restart: unless-stopped
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: portfolio-cadvisor-dev
    restart: unless-stopped
    privileged: true
    expose:
      - "8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge
    name: portfolio-monitoring-network
  app:
    external: true
    name: global-portfolio-network

volumes:
  prometheus-data:
  grafana-data:
