global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 앱 메트릭
  - job_name: backend-dev
    static_configs:
      - targets: ['portfolio-backend-dev:3000']
        labels:
          server: dev

  - job_name: backend-prod
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ['hsm9411.duckdns.org']
        labels:
          server: prod

  # 시스템 메트릭 — node-exporter (server 라벨로 dev/prod 구분)
  # job_name=node_exporter → Node Exporter Full(#1860) 대시보드 기본 필터 일치
  - job_name: node_exporter
    static_configs:
      - targets: ['10.0.0.196:9100']
        labels:
          server: dev
      - targets: ['10.0.0.34:9100']
        labels:
          server: prod

  # 컨테이너 메트릭 — cAdvisor (server 라벨로 dev/prod 구분)
  # job_name=cadvisor → cAdvisor 대시보드(#14282) 기본 필터 일치
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          server: dev
      - targets: ['10.0.0.34:8080']
        labels:
          server: prod

  # nginx 메트릭 (server 라벨로 dev/prod 구분)
  - job_name: nginx
    static_configs:
      - targets: ['portfolio-nginx-exporter-dev:9113']
        labels:
          server: dev
      - targets: ['10.0.0.34:9113']
        labels:
          server: prod

  # Redis 메트릭 (server 라벨로 dev/prod 구분)
  # job_name=redis_exporter → Redis 대시보드(#11835) 기본 필터 일치
  - job_name: redis_exporter
    static_configs:
      - targets: ['portfolio-redis-exporter-dev:9121']
        labels:
          server: dev
      - targets: ['10.0.0.34:9121']
        labels:
          server: prod
