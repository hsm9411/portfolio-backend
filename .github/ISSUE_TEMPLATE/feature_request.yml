name: Feature Request
description: 새로운 기능을 제안할 때 사용합니다
title: "[Feat] "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        새로운 기능을 제안해 주세요. 구체적일수록 좋습니다.

  - type: dropdown
    id: module
    attributes:
      label: 대상 모듈
      description: 기능이 추가될 모듈을 선택하세요
      options:
        - auth
        - projects
        - blog
        - common/shared
        - ci-cd
        - infra/docker
        - 신규 모듈
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 기능 요약
      description: 어떤 기능인지 한 문장으로 설명해 주세요
      placeholder: 예) 프로젝트 목록 조회 API에 태그 필터링 기능 추가
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: 배경 및 동기
      description: 왜 이 기능이 필요한가요?
      placeholder: 프론트엔드에서 특정 기술 스택으로 프로젝트를 필터링해야 함
    validations:
      required: true

  - type: textarea
    id: spec
    attributes:
      label: 상세 스펙
      description: API 스펙, 엔티티 변경사항 등 구체적인 내용을 작성해 주세요
      placeholder: |
        - GET /projects?tags=nestjs,postgresql
        - Query parameter: tags (comma-separated)
        - 응답: 해당 태그를 모두 포함하는 프로젝트 목록
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건 (Acceptance Criteria)
      placeholder: |
        - [ ] GET /projects?tags=nestjs 호출 시 nestjs 태그 프로젝트만 반환
        - [ ] 존재하지 않는 태그 필터 시 빈 배열 반환
        - [ ] Swagger 문서에 query parameter 반영
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      options:
        - high
        - medium
        - low
    validations:
      required: true
