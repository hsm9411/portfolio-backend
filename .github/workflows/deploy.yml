name: Deploy to Oracle Cloud

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================
  # Job 1: Lint (PR 및 배포 전 게이트)
  # ============================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint:ci

  # ============================================================
  # Job 2: Docker 이미지 빌드 & GHCR Push (push 이벤트만)
  # ============================================================
  build-and-push:
    name: Build and Push Docker Image
    needs: lint
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Job 3: main → Production 배포 (Server 1: 158.180.75.205)
  # ============================================================
  deploy-prod:
    name: Deploy to Production
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.ORACLE_SSH_KEY_PROD }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat >> ~/.ssh/config << 'EOF'
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR
            ServerAliveInterval 30
            ServerAliveCountMax 6
          EOF
          chmod 600 ~/.ssh/config

      - name: Prepare directories and network
        env:
          HOST: ${{ secrets.ORACLE_HOST_PROD }}
          USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh ${USER}@${HOST} "docker network inspect global-portfolio-network >/dev/null 2>&1 || docker network create global-portfolio-network"
          ssh ${USER}@${HOST} "mkdir -p ~/portfolio-backend/nginx/conf.d ~/portfolio-backend/nginx/ssl/prod ~/portfolio-backend/nginx/logs"

      - name: Deploy files
        env:
          HOST: ${{ secrets.ORACLE_HOST_PROD }}
          USER: ${{ secrets.ORACLE_USER }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          scp docker-compose.yml                   ${USER}@${HOST}:~/portfolio-backend/docker-compose.yml
          scp docker-compose.nginx.yml             ${USER}@${HOST}:~/portfolio-backend/docker-compose.nginx.yml
          scp nginx/conf.d/portfolio-prod.conf     ${USER}@${HOST}:~/portfolio-backend/nginx/conf.d/portfolio.conf
          scp deploy.sh                            ${USER}@${HOST}:~/portfolio-backend/deploy.sh

      - name: Start or reload Nginx
        env:
          HOST: ${{ secrets.ORACLE_HOST_PROD }}
          USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh ${USER}@${HOST} "
            cd ~/portfolio-backend
            if docker ps --format '{{.Names}}' | grep -q '^portfolio-nginx$'; then
              docker exec portfolio-nginx nginx -t && docker exec portfolio-nginx nginx -s reload
              echo 'Nginx reloaded'
            else
              docker compose -f docker-compose.nginx.yml up -d
              echo 'Nginx started'
            fi
          "

      - name: Deploy application
        env:
          HOST: ${{ secrets.ORACLE_HOST_PROD }}
          USER: ${{ secrets.ORACLE_USER }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ssh ${USER}@${HOST} "cd ~/portfolio-backend && chmod +x deploy.sh && export GITHUB_REPOSITORY=${GITHUB_REPOSITORY} && export IMAGE_TAG=latest && ./deploy.sh"

      - name: Deploy monitoring exporters
        env:
          HOST: ${{ secrets.ORACLE_HOST_PROD }}
          USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh ${USER}@${HOST} "mkdir -p ~/monitoring"
          scp monitoring/docker-compose.exporters.yml ${USER}@${HOST}:~/monitoring/docker-compose.yml
          ssh ${USER}@${HOST} "cd ~/monitoring && docker compose up -d"

      - name: Verify deployment (poll /health)
        env:
          HOST: ${{ secrets.ORACLE_HOST_PROD }}
          USER: ${{ secrets.ORACLE_USER }}
        run: |
          echo "Polling https://hsm9411.duckdns.org/health (timeout 90s)..."
          for i in $(seq 1 30); do
            if curl -sf -m 5 https://hsm9411.duckdns.org/health >/dev/null; then
              echo "Health OK after $((i * 3))s"
              ssh ${USER}@${HOST} "docker ps | grep portfolio"
              exit 0
            fi
            sleep 3
          done
          echo "Health check failed after 90s — diagnostics below"
          ssh ${USER}@${HOST} "docker ps -a | grep portfolio || true"
          ssh ${USER}@${HOST} "docker logs --tail 80 portfolio-backend || true"
          exit 1

      - name: Rollback to previous image
        if: failure()
        env:
          HOST: ${{ secrets.ORACLE_HOST_PROD }}
          USER: ${{ secrets.ORACLE_USER }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          echo "::warning::Verify failed — attempting rollback to :previous-latest"
          ssh ${USER}@${HOST} "
            set -e
            cd ~/portfolio-backend
            PREVIOUS=ghcr.io/${GITHUB_REPOSITORY}:previous-latest
            if ! docker image inspect \$PREVIOUS >/dev/null 2>&1; then
              echo 'No :previous-latest image available — manual intervention required'
              exit 1
            fi
            docker tag \$PREVIOUS ghcr.io/${GITHUB_REPOSITORY}:latest
            export GITHUB_REPOSITORY=${GITHUB_REPOSITORY}
            export IMAGE_TAG=latest
            docker compose up -d
          "
          echo "Polling /health after rollback (timeout 60s)..."
          for i in $(seq 1 20); do
            if curl -sf -m 5 https://hsm9411.duckdns.org/health >/dev/null; then
              echo "::warning::Rollback successful — health OK after $((i * 3))s. Workflow remains failed so the bad deploy is visible."
              exit 0
            fi
            sleep 3
          done
          echo "::error::Rollback applied but /health still failing — manual intervention needed"
          exit 1

  # ============================================================
  # Job 4: develop → Development 배포 (Server 2: 152.67.216.145)
  # ============================================================
  deploy-dev:
    name: Deploy to Development
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.ORACLE_SSH_KEY_DEV }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat >> ~/.ssh/config << 'EOF'
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR
            ServerAliveInterval 30
            ServerAliveCountMax 6
          EOF
          chmod 600 ~/.ssh/config

      - name: Prepare directories and network
        env:
          HOST: ${{ secrets.ORACLE_HOST_DEV }}
          USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh ${USER}@${HOST} "docker network inspect global-portfolio-network >/dev/null 2>&1 || docker network create global-portfolio-network"
          ssh ${USER}@${HOST} "mkdir -p ~/portfolio-backend/nginx/conf.d ~/portfolio-backend/nginx/ssl/dev ~/portfolio-backend/nginx/logs"
          ssh ${USER}@${HOST} "mkdir -p ~/portfolio-backend-dev"

      - name: Deploy Nginx files
        env:
          HOST: ${{ secrets.ORACLE_HOST_DEV }}
          USER: ${{ secrets.ORACLE_USER }}
        run: |
          scp docker-compose.nginx.yml             ${USER}@${HOST}:~/portfolio-backend/docker-compose.nginx.yml
          scp nginx/conf.d/portfolio-dev.conf      ${USER}@${HOST}:~/portfolio-backend/nginx/conf.d/portfolio.conf

      - name: Start or reload Nginx
        env:
          HOST: ${{ secrets.ORACLE_HOST_DEV }}
          USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh ${USER}@${HOST} "
            cd ~/portfolio-backend
            if docker ps --format '{{.Names}}' | grep -q '^portfolio-nginx$'; then
              docker exec portfolio-nginx nginx -t && docker exec portfolio-nginx nginx -s reload
              echo 'Nginx reloaded'
            else
              docker compose -f docker-compose.nginx.yml up -d
              echo 'Nginx started'
            fi
          "

      - name: Deploy application
        env:
          HOST: ${{ secrets.ORACLE_HOST_DEV }}
          USER: ${{ secrets.ORACLE_USER }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          scp docker-compose.dev.yml  ${USER}@${HOST}:~/portfolio-backend-dev/docker-compose.yml
          scp deploy.sh               ${USER}@${HOST}:~/portfolio-backend-dev/deploy.sh
          ssh ${USER}@${HOST} "cd ~/portfolio-backend-dev && chmod +x deploy.sh && export GITHUB_REPOSITORY=${GITHUB_REPOSITORY} && export IMAGE_TAG=develop && ./deploy.sh"

      - name: Deploy monitoring stack
        env:
          HOST: ${{ secrets.ORACLE_HOST_DEV }}
          USER: ${{ secrets.ORACLE_USER }}
        run: |
          ssh ${USER}@${HOST} "mkdir -p ~/monitoring/prometheus ~/monitoring/grafana/provisioning/datasources ~/monitoring/grafana/provisioning/dashboards/json"
          scp monitoring/docker-compose.monitoring.yml                              ${USER}@${HOST}:~/monitoring/docker-compose.yml
          scp monitoring/prometheus/prometheus.yml                                  ${USER}@${HOST}:~/monitoring/prometheus/prometheus.yml
          scp monitoring/grafana/provisioning/datasources/prometheus.yml            ${USER}@${HOST}:~/monitoring/grafana/provisioning/datasources/prometheus.yml
          scp monitoring/grafana/provisioning/dashboards/dashboards.yml             ${USER}@${HOST}:~/monitoring/grafana/provisioning/dashboards/dashboards.yml
          scp monitoring/grafana/provisioning/dashboards/json/node-exporter-full.json \
              monitoring/grafana/provisioning/dashboards/json/nginx-prometheus-exporter.json \
              monitoring/grafana/provisioning/dashboards/json/redis-dashboard.json \
              monitoring/grafana/provisioning/dashboards/json/cadvisor.json \
              ${USER}@${HOST}:~/monitoring/grafana/provisioning/dashboards/json/
          printf 'GRAFANA_ADMIN_PASSWORD=%s\n' '${{ secrets.GRAFANA_ADMIN_PASSWORD }}' > /tmp/monitoring.env
          scp /tmp/monitoring.env ${USER}@${HOST}:~/monitoring/.env
          ssh ${USER}@${HOST} "cd ~/monitoring && docker compose up -d && docker exec portfolio-prometheus wget -qO- --post-data='' http://localhost:9090/-/reload || true"

      - name: Verify deployment (poll /health)
        env:
          HOST: ${{ secrets.ORACLE_HOST_DEV }}
          USER: ${{ secrets.ORACLE_USER }}
        run: |
          echo "Polling https://hsm9411-dev.duckdns.org/health (timeout 90s)..."
          for i in $(seq 1 30); do
            if curl -sf -m 5 https://hsm9411-dev.duckdns.org/health >/dev/null; then
              echo "Health OK after $((i * 3))s"
              ssh ${USER}@${HOST} "docker ps | grep portfolio"
              exit 0
            fi
            sleep 3
          done
          echo "Health check failed after 90s — diagnostics below"
          ssh ${USER}@${HOST} "docker ps -a | grep portfolio || true"
          ssh ${USER}@${HOST} "docker logs --tail 80 portfolio-backend-dev || true"
          exit 1

      - name: Rollback to previous image
        if: failure()
        env:
          HOST: ${{ secrets.ORACLE_HOST_DEV }}
          USER: ${{ secrets.ORACLE_USER }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          echo "::warning::Verify failed — attempting rollback to :previous-develop"
          ssh ${USER}@${HOST} "
            set -e
            cd ~/portfolio-backend-dev
            PREVIOUS=ghcr.io/${GITHUB_REPOSITORY}:previous-develop
            if ! docker image inspect \$PREVIOUS >/dev/null 2>&1; then
              echo 'No :previous-develop image available — manual intervention required'
              exit 1
            fi
            docker tag \$PREVIOUS ghcr.io/${GITHUB_REPOSITORY}:develop
            export GITHUB_REPOSITORY=${GITHUB_REPOSITORY}
            export IMAGE_TAG=develop
            docker compose up -d
          "
          echo "Polling /health after rollback (timeout 60s)..."
          for i in $(seq 1 20); do
            if curl -sf -m 5 https://hsm9411-dev.duckdns.org/health >/dev/null; then
              echo "::warning::Rollback successful — health OK after $((i * 3))s. Workflow remains failed so the bad deploy is visible."
              exit 0
            fi
            sleep 3
          done
          echo "::error::Rollback applied but /health still failing — manual intervention needed"
          exit 1
